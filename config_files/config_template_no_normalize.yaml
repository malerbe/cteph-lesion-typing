data:
  dataset_dir: '/data/lmalerba/lesions_patches_dataset_not_normalized'
  task: classification
  splits_file: '/data/lmalerba/lesions_patches_dataset_not_normalized/cv_splits.json'
  val_fold: 5
  transforms_name: none
  batch_size: 8
  num_workers: 0
  per_image_normalize: true # To be deactivated if global normalization was performed by lesion_patches_extraction.py

model:
  class: MonaiResNet3D
  depth: 50       # 10, 18, 34 ou 50 (défaut: 18)
  pretrained: false
  model_path: '/data/lmalerba/logs/Deep3DCNN_2/best_model.pt' 

loss:
  name: CrossEntropyLoss

logging:
  logdir: "/data/lmalerba/logs"

phase1:
  optim:
    algo: Adam
    params:
      lr: 0.001
  scheduler:
    algo: CosineAnnealingLR
    params:
      T_max: 20             # = nepochs for this phase
      eta_min: 0.00001